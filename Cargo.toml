[workspace]
members = ["tools/xtask", "experiments/kernel-link", "experiments/userland-link", "kernel"]
default-members = ["tools/xtask"]
exclude = ["experiments/dependencies"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
license-file = "LICENSE"

[profile.feasibility]
inherits = "release"
panic = "abort"
opt-level = 1
debug = 2
strip = false
lto = false
codegen-units = 1

[profile.kernel-dev]
inherits = "feasibility"

[profile.m2-comparison]
inherits = "release"
opt-level = 3
debug = 1
lto = false
codegen-units = 1

[profile.m2-diagnostic]
inherits = "dev"
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
