[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[features]
slint-candidate = ["dep:slint"]
behavior-v2 = ["custom-ui/behavior-v2"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "unsafe-single-threaded", "libm", "renderer-software"], optional = true }
custom-ui = { path = "../../crates/custom-ui" }
editor-model = { path = "../../crates/editor-model" }
text-core = { path = "../../crates/text-core" }
unicode-segmentation = { version = "=1.13.3", default-features = false }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
