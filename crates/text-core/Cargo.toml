[package]
name = "text-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
editor-model = { path = "../editor-model" }
unicode-segmentation = { version = "=1.13.3", default-features = false }
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-linebreak = "=0.1.5"
unicode-script = "=0.5.8"
rustybuzz = { version = "=0.20.1", default-features = false }
fontdue = { version = "=0.9.4", default-features = false, features = ["hashbrown"] }
sha2 = { version = "=0.11.1", default-features = false }
