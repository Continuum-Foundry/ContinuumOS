[workspace]
resolver = "2"

[package]
name = "dependency-probes"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"

[features]
architecture = ["dep:x86_64"]
raster = ["dep:tiny-skia"]
shaping = ["dep:rustybuzz"]
font = ["dep:fontdue"]
toolkit = ["dep:slint"]

[dependencies]
x86_64 = { version = "=0.15.5", default-features = false, features = ["instructions"], optional = true }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["no-std-float"], optional = true }
rustybuzz = { version = "=0.20.1", default-features = false, optional = true }
fontdue = { version = "=0.9.4", default-features = false, features = ["hashbrown"], optional = true }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "unsafe-single-threaded", "libm", "renderer-software"], optional = true }

[[bin]]
name = "dependency-link"
path = "src/link.rs"
test = false
bench = false

[profile.release]
panic = "abort"
lto = false
opt-level = 1
