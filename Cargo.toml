[workspace]
members = ["tools/xtask", "experiments/kernel-link", "experiments/userland-link"]
default-members = ["tools/xtask"]
exclude = ["experiments/dependencies"]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false

[profile.feasibility]
inherits = "release"
panic = "abort"
opt-level = 1
debug = 2
strip = false
lto = false
codegen-units = 1
