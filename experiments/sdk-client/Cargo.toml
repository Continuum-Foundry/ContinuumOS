[workspace]
resolver = "2"
[package]
name = "sdk-client"
version = "0.1.0"
edition = "2024"
publish = false
license-file = "../../LICENSE"
[dependencies]
continuum-rt = { path = "../../sdk/continuum-rt", version = "=0.1.0" }
editor-model = { path = "../../crates/editor-model" }
unicode-segmentation = { version = "=1.13.3", default-features = false }
libm = { version = "=0.2.16", default-features = false }
[features]
runtime-smoke = []
[[bin]]
name = "sdk-image"
path = "src/main.rs"
test = false
bench = false
[profile.release]
panic = "abort"
opt-level = 1
debug = 0
lto = false
codegen-units = 1
