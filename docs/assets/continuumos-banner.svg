<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">ContinuumOS</title>
  <desc id="desc">An original desktop operating system built for continuity. An abstract continuous path flows through architectural frames on a dark blue field. Conceptual artwork, not a desktop screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2d"/><stop offset="1" stop-color="#080e19"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#57dfce"/><stop offset=".55" stop-color="#a3bcff"/><stop offset="1" stop-color="#f0bc98"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#224d61" stop-opacity=".55"/><stop offset="1" stop-color="#224d61" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#9db6d4" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1440" height="520" rx="20" fill="url(#bg)"/>
  <rect width="1440" height="520" rx="20" fill="url(#grid)"/>
  <ellipse cx="1070" cy="240" rx="480" ry="360" fill="url(#light)"/>
  <path d="M64 71h26m-13-13v26" stroke="#62d9cb" stroke-width="2"/>
  <text x="106" y="77" fill="#99afc5" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="3">CONTINUITY BY DESIGN</text>
  <g fill="none" stroke="#8ca9c9" stroke-opacity=".2">
    <rect x="890" y="104" width="294" height="220" rx="18" transform="rotate(-12 1037 214)"/>
    <rect x="972" y="164" width="294" height="220" rx="18" transform="rotate(8 1119 274)"/>
    <rect x="1055" y="223" width="294" height="220" rx="18" transform="rotate(23 1202 333)"/>
  </g>
  <path d="M823 293C890 146 1035 150 1090 245S1221 356 1300 257" fill="none" stroke="#63c5cb" stroke-opacity=".08" stroke-width="42" stroke-linecap="round"/>
  <path d="M823 293C890 146 1035 150 1090 245S1221 356 1300 257" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="823" cy="293" r="7" fill="#63dece"/>
  <circle cx="1300" cy="257" r="7" fill="#efbd9e"/>
  <circle cx="1060" cy="207" r="7" fill="#a3bcff" stroke="#101c2d" stroke-width="4"/>
  <text x="64" y="244" fill="#f2f5f9" font-family="Segoe UI,Arial,sans-serif" font-size="91" font-weight="650" letter-spacing="-5">Continuum<tspan fill="#72ddcf">OS</tspan></text>
  <text x="68" y="299" fill="#b7c6d8" font-family="Segoe UI,Arial,sans-serif" font-size="25" letter-spacing=".3">Build the system. Keep your place.</text>
  <path d="M68 356H752" stroke="#7a94b2" stroke-opacity=".2"/>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">
    <text x="68" y="395" fill="#76ddcf">ORIGINAL RUST KERNEL</text>
    <text x="323" y="395" fill="#a9baff">LIVE DEVELOPMENT VISION</text>
    <text x="611" y="395" fill="#edbd9c">UEFI ISO</text>
  </g>
  <text x="68" y="465" fill="#627a94" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">AN EXPERIMENTAL DESKTOP OS / ENGINEERED IN THE OPEN</text>
  <path d="M1339 66h32v32M1339 454h32v-32" fill="none" stroke="#5e819e" stroke-opacity=".45"/>
</svg>
