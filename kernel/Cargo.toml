[package]
name = "continuum-kernel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license-file.workspace = true

[[bin]]
name = "continuum-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
limine = { version = "=0.5.0", default-features = false }

[features]
default = []
emulator-test = []
fault-before-entry = ["emulator-test"]
boot-inject = ["emulator-test"]
exception-test = ["emulator-test"]
memory-test = ["emulator-test"]
timer-test = ["exception-test"]
runtime-memory-test = ["emulator-test"]
static-loader-test = ["emulator-test"]
