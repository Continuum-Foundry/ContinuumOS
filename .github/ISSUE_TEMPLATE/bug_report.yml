name: Reproducible defect
description: Report a defect with sanitized evidence. Do not disclose security issues here.
body:
  - type: markdown
    attributes:
      value: |
        EXPORT_CONTROL.md currently blocks project-material uploads to unverified services.
        Keep this report local until U.S.-only handling is approved.
        For vulnerabilities or credentials, follow SECURITY.md instead.
        External patches are paused; do not paste code or data you cannot share.
  - type: input
    id: identity
    attributes:
      label: Commit and artifact identity
      description: Commit SHA, affected kernel/ISO/build identity, and relevant input hashes.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact command, declared host/VM profile, and minimal steps. No secrets or full environment dumps.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and observed behavior
      description: Include sanitized errors and evidence paths. Say whether this was compile, package, boot, or runtime.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Disclosure check
      options:
        - label: This report contains no vulnerability details, credentials, confidential third-party data, or unrelated personal information.
          required: true
